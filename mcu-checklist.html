<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MCU Watch Order Checklist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;500;700&display=swap');

  :root{
    --bg: #131313;
    --panel: #1c1c1c;
    --paper: #f3ede0;
    --red: #d21f2f;
    --red-dark: #8f1420;
    --gold: #e8b13a;
    --ink: #1b1b1b;
    --muted: #7a7568;
    --line: #d9d0b8;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: radial-gradient(circle at 20% 10%, #232323, var(--bg) 60%);
    font-family: 'Rubik', sans-serif;
    color: var(--ink);
    min-height:100vh;
    padding: 24px 12px 60px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }

  .hero{
    position: relative;
    background: var(--red);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.14) 1.4px, transparent 1.5px);
    background-size: 10px 10px;
    border: 3px solid #000;
    border-radius: 6px;
    padding: 22px 20px 26px;
    box-shadow: 0 6px 0 #000, 0 6px 18px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(115deg, rgba(255,255,255,0.16), transparent 40%);
  }
  .eyebrow{
    font-family:'Bangers', cursive;
    letter-spacing: 2px;
    color: var(--gold);
    font-size: 15px;
    margin: 0 0 4px;
    text-shadow: 1px 1px 0 #000;
  }
  h1{
    font-family:'Bangers', cursive;
    font-size: 40px;
    line-height: 1;
    letter-spacing: 1px;
    color: #fff;
    margin: 0 0 14px;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
  }
  .stats{
    display:flex; gap: 10px; flex-wrap: wrap;
  }
  .stat{
    background: rgba(0,0,0,0.35);
    border: 2px solid #000;
    border-radius: 4px;
    padding: 8px 14px;
    color: #fff;
    min-width: 92px;
  }
  .stat .n{ font-family:'Bangers', cursive; font-size: 22px; color: var(--gold); display:block; line-height:1;}
  .stat .l{ font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: #f1e3c6; }

  .bar-track{
    margin-top: 14px;
    height: 14px;
    background: rgba(0,0,0,0.4);
    border: 2px solid #000;
    border-radius: 8px;
    overflow: hidden;
  }
  .bar-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--gold), #fff2c9);
    width: 0%;
    transition: width .4s ease;
  }

  .controls{
    display:flex; gap:8px; margin: 16px 0 6px; flex-wrap: wrap;
  }
  .tab{
    font-family:'Bangers', cursive;
    letter-spacing: 1px;
    font-size: 15px;
    background: var(--panel);
    color: #d8d3c4;
    border: 2px solid #000;
    border-radius: 4px;
    padding: 7px 16px;
    cursor: pointer;
  }
  .tab.active{ background: var(--gold); color: #1b1200; }
  .reset-btn{
    margin-left:auto;
    font-family:'Rubik', sans-serif;
    font-size: 12.5px;
    background: transparent;
    color: #9a9689;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .reset-btn:hover{ color: #fff; border-color:#888; }

  .saga{
    background: var(--paper);
    border: 3px solid #000;
    border-radius: 6px;
    margin-top: 14px;
    box-shadow: 0 6px 0 #000, 0 6px 16px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .saga-head{
    background: var(--ink);
    color: var(--gold);
    font-family: 'Bangers', cursive;
    letter-spacing: 1.5px;
    font-size: 19px;
    padding: 10px 16px;
    display:flex; justify-content: space-between; align-items:center;
    border-bottom: 3px solid #000;
  }
  .saga-head span.count{ font-family:'Rubik'; font-size: 12px; color: #c9c3ad; }

  ul.list{ list-style:none; margin:0; padding: 6px 0; }
  li.item{
    display:flex; align-items:flex-start; gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }
  li.item:last-child{ border-bottom:none; }
  li.item:hover{ background: #ece2c9; }

  .box{
    flex: 0 0 22px;
    width: 22px; height: 22px;
    border: 2.5px solid var(--ink);
    border-radius: 3px;
    background: #fff;
    display:flex; align-items:center; justify-content:center;
    margin-top: 1px;
  }
  .box svg{ width:16px; height:16px; opacity:0; transform: scale(0.6); transition: all .12s ease; }
  li.item.done .box{ background: var(--red); border-color: var(--red-dark); }
  li.item.done .box svg{ opacity:1; transform: scale(1); }
  li.item.done .title{ text-decoration: line-through; color: var(--muted); }

  .title{ font-size: 15px; font-weight: 500; line-height:1.35; flex:1; }
  .year{ color: var(--muted); font-weight: 400; }
  .dur{
    flex: 0 0 auto;
    font-size: 11.5px;
    color: var(--red-dark);
    background: #e9dfc3;
    border: 1px solid #c9bd93;
    border-radius: 10px;
    padding: 2px 9px;
    white-space: nowrap;
    margin-top: 2px;
  }
  li.item.done .dur{ color: var(--muted); background: #ded4b8; border-color: #c9bd93; }

  footer{
    text-align:center; color:#6a6a6a; font-size:11.5px; margin-top:24px;
  }

  @media (max-width:480px){
    h1{ font-size: 30px; }
    .stat{ min-width: 78px; padding:7px 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <p class="eyebrow">Marvel cinematic universe</p>
    <h1>Watch order checklist</h1>
    <div class="stats">
      <div class="stat"><span class="n" id="statDone">0</span><span class="l">watched</span></div>
      <div class="stat"><span class="n" id="statLeft">0</span><span class="l">to go</span></div>
      <div class="stat"><span class="n" id="statPct">0%</span><span class="l">complete</span></div>
    </div>
    <div class="stats" style="margin-top:8px;">
      <div class="stat"><span class="n" id="hoursDone">0h</span><span class="l">watch time logged</span></div>
      <div class="stat"><span class="n" id="hoursLeft">0h</span><span class="l">watch time left</span></div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <div class="controls">
    <button class="tab active" data-tab="all">All</button>
    <button class="tab" data-tab="infinity">Infinity saga</button>
    <button class="tab" data-tab="multiverse">Multiverse saga</button>
    <button class="reset-btn" id="resetBtn">Reset all</button>
  </div>

  <div id="lists"></div>

  <footer>Tap a title to mark it watched. Your progress is saved automatically. Series runtimes are approximate totals across all episodes.</footer>
</div>

<script>
// runtime in minutes: movies = theatrical runtime, series = sum of all episodes
const DATA = {
  infinity: {
    label: "The Infinity Saga",
    items: [
      ["Captain America: The First Avenger (2011)", 124],
      ["Captain Marvel (2019)", 123],
      ["Iron Man (2008)", 126],
      ["Iron Man 2 (2010)", 124],
      ["The Incredible Hulk (2008)", 112],
      ["Thor (2011)", 115],
      ["Avengers (2012)", 143],
      ["Thor: The Dark World (2013)", 112],
      ["Iron Man 3 (2013)", 130],
      ["Captain America: The Winter Soldier (2014)", 136],
      ["Guardians of the Galaxy (2014)", 121],
      ["Guardians of the Galaxy Vol. 2 (2017)", 136],
      ["I am Groot (2022-2023)", 25],
      ["Avengers: Age of Ultron (2015)", 141],
      ["Ant-Man (2015)", 117],
      ["Captain America: Civil War (2016)", 147],
      ["Black Widow (2021)", 134],
      ["Black Panther (2018)", 134],
      ["Spider-Man: Homecoming (2017)", 133],
      ["Doctor Strange (2016)", 115],
      ["Thor: Ragnarok (2017)", 130],
      ["Ant-Man and The Wasp (2018)", 118],
      ["Avengers: Infinity War (2018)", 149],
      ["Avengers: Endgame (2019)", 181]
    ]
  },
  multiverse: {
    label: "The Multiverse Saga",
    items: [
      ["Loki (2021-2023)", 600],
      ["Spider-Man: Far From Home (2019)", 129],
      ["Spider-Man: No Way Home (2021)", 148],
      ["What if...? (2021-2024)", 910],
      ["WandaVision (2021)", 320],
      ["Shang-Chi and the Legend of the Ten Rings (2021)", 132],
      ["The Falcon and the Winter Soldier (2021)", 290],
      ["Eternals (2021)", 156],
      ["Doctor Strange in the Multiverse of Madness (2022)", 126],
      ["Hawkeye (2021)", 290],
      ["Moon Knight (2022)", 290],
      ["Black Panther: Wakanda Forever (2022)", 161],
      ["She-Hulk (2022)", 300],
      ["Ms. Marvel (2022)", 210],
      ["Thor: Love and Thunder (2022)", 119],
      ["Ironheart (2025)", 240],
      ["Werewolf by Night (2022)", 55],
      ["Guardians of the Galaxy: Holiday Special (2022)", 44],
      ["Ant-Man and The Wasp: Quantumania (2023)", 125],
      ["Guardians of the Galaxy Vol. 3 (2023)", 150],
      ["Secret Invasion (2023)", 200],
      ["The Marvels (2023)", 105],
      ["Deadpool & Wolverine (2024)", 128],
      ["Agatha All Along (2024)", 340],
      ["Captain America: Brave New World (2025)", 118],
      ["Thunderbolts* (2025)", 127]
    ]
  }
};

const STORAGE_KEY = "mcu-checklist-progress";
let state = {};
let currentTab = "all";
let storageWarned = false;
let hasCloudStorage = typeof window.storage !== 'undefined';

function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

async function loadState(){
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      state = res ? JSON.parse(res.value) : {};
      return;
    }catch(e){
      // fall through to local storage below
    }
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : {};
  }catch(e){
    state = {};
  }
}

function showStorageWarning(text){
  if(storageWarned) return;
  storageWarned = true;
  const banner = document.createElement('div');
  banner.textContent = text;
  banner.style.cssText = "background:#3a2a12;color:#f0c98a;border:2px solid #000;border-radius:6px;padding:8px 12px;font-size:12.5px;margin-top:12px;";
  document.querySelector('.hero').after(banner);
}

async function saveState(retries = 2){
  if(hasCloudStorage){
    for(let attempt = 0; attempt <= retries; attempt++){
      try{
        await window.storage.set(STORAGE_KEY, JSON.stringify(state));
        return;
      }catch(e){
        if(attempt < retries){
          await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
        }
      }
    }
  }
  // cloud storage unavailable or exhausted retries: try browser local storage instead
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if(hasCloudStorage){
      showStorageWarning("Saving to Claude's cloud storage isn't working right now, so progress is being kept in this browser instead. It'll persist here but won't follow you to another device.");
    }
  }catch(e){
    showStorageWarning("Progress isn't saving anywhere right now, so it'll reset if you close this. Your taps still work in the meantime.");
  }
}

function checkSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"></polyline></svg>';
}

function formatHours(minutes){
  const h = minutes / 60;
  if(h < 10) return (Math.round(h*10)/10) + 'h';
  return Math.round(h) + 'h';
}

function render(){
  const container = document.getElementById('lists');
  container.innerHTML = '';

  const sagasToShow = currentTab === 'all' ? ['infinity','multiverse'] : [currentTab];

  let totalDone = 0, totalCount = 0;
  let minutesDone = 0, minutesTotal = 0;

  sagasToShow.forEach(sagaKey => {
    const saga = DATA[sagaKey];
    const sagaEl = document.createElement('div');
    sagaEl.className = 'saga';

    let doneCount = 0;
    let sagaMinDone = 0, sagaMinTotal = 0;
    const listHtml = saga.items.map(([item, mins]) => {
      const id = sagaKey + ':' + slugify(item);
      const isDone = !!state[id];
      if(isDone) doneCount++;
      sagaMinTotal += mins;
      if(isDone) sagaMinDone += mins;
      const match = item.match(/^(.*)\s(\(.+\))$/);
      const title = match ? match[1] : item;
      const year = match ? match[2] : '';
      return `<li class="item ${isDone ? 'done':''}" data-id="${id}">
        <div class="box">${checkSvg()}</div>
        <div class="title">${title} <span class="year">${year}</span></div>
        <div class="dur">${formatHours(mins)}</div>
      </li>`;
    }).join('');

    totalDone += doneCount;
    totalCount += saga.items.length;
    minutesDone += sagaMinDone;
    minutesTotal += sagaMinTotal;

    sagaEl.innerHTML = `
      <div class="saga-head">
        <span>${saga.label}</span>
        <span class="count">${doneCount} / ${saga.items.length} &middot; ${formatHours(sagaMinDone)} / ${formatHours(sagaMinTotal)}</span>
      </div>
      <ul class="list">${listHtml}</ul>
    `;
    container.appendChild(sagaEl);
  });

  document.getElementById('statDone').textContent = totalDone;
  document.getElementById('statLeft').textContent = totalCount - totalDone;
  const pct = totalCount ? Math.round((totalDone/totalCount)*100) : 0;
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('hoursDone').textContent = formatHours(minutesDone);
  document.getElementById('hoursLeft').textContent = formatHours(minutesTotal - minutesDone);

  container.querySelectorAll('.item').forEach(li => {
    li.addEventListener('click', () => {
      const id = li.dataset.id;
      state[id] = !state[id];
      render();
      saveState();
    });
  });
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
  });
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if(confirm('Reset all watched progress?')){
    state = {};
    await saveState();
    render();
  }
});

(async () => {
  await loadState();
  render();
})();
</script>
</body>
</html>
