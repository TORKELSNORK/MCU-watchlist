<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MCU Watch Order Checklist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;500;700&display=swap');

  :root{
    --bg: #131313;
    --panel: #1c1c1c;
    --paper: #f3ede0;
    --red: #d21f2f;
    --red-dark: #8f1420;
    --gold: #e8b13a;
    --ink: #1b1b1b;
    --muted: #7a7568;
    --line: #d9d0b8;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: radial-gradient(circle at 20% 10%, #232323, var(--bg) 60%);
    font-family: 'Rubik', sans-serif;
    color: var(--ink);
    min-height:100vh;
    padding: 16px 10px 40px;
    overflow-x: hidden;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }

  .hero{
    position: relative;
    background: var(--red);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.14) 1.4px, transparent 1.5px);
    background-size: 10px 10px;
    border: 3px solid #000;
    border-radius: 6px;
    padding: 22px 20px 26px;
    box-shadow: 0 6px 0 #000, 0 6px 18px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(115deg, rgba(255,255,255,0.16), transparent 40%);
  }
  .eyebrow{
    font-family:'Bangers', cursive;
    letter-spacing: 2px;
    color: var(--gold);
    font-size: 15px;
    margin: 0 0 4px;
    text-shadow: 1px 1px 0 #000;
  }
  h1{
    font-family:'Bangers', cursive;
    font-size: 40px;
    line-height: 1;
    letter-spacing: 1px;
    color: #fff;
    margin: 0 0 14px;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
  }
  .stats{
    display:flex; gap: 10px; flex-wrap: wrap;
  }
  .stat{
    background: rgba(0,0,0,0.35);
    border: 2px solid #000;
    border-radius: 4px;
    padding: 8px 14px;
    color: #fff;
    min-width: 92px;
  }
  .stat .n{ font-family:'Bangers', cursive; font-size: 22px; color: var(--gold); display:block; line-height:1;}
  .stat .l{ font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: #f1e3c6; }

  .bar-track{
    margin-top: 14px;
    height: 14px;
    background: rgba(0,0,0,0.4);
    border: 2px solid #000;
    border-radius: 8px;
    overflow: hidden;
  }
  .bar-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--gold), #fff2c9);
    width: 0%;
    transition: width .4s ease;
  }

  .controls{
    display:flex; gap:8px; margin: 16px 0 6px; flex-wrap: wrap;
  }
  .tab{
    font-family:'Bangers', cursive;
    letter-spacing: 1px;
    font-size: 15px;
    background: var(--panel);
    color: #d8d3c4;
    border: 2px solid #000;
    border-radius: 4px;
    padding: 7px 16px;
    cursor: pointer;
  }
  .tab.active{ background: var(--gold); color: #1b1200; }
  .reset-btn{
    margin-left:auto;
    font-family:'Rubik', sans-serif;
    font-size: 12.5px;
    background: transparent;
    color: #9a9689;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .reset-btn:hover{ color: #fff; border-color:#888; }

  .saga{
    background: var(--paper);
    border: 3px solid #000;
    border-radius: 6px;
    margin-top: 14px;
    box-shadow: 0 6px 0 #000, 0 6px 16px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .saga-head{
    background: var(--ink);
    color: var(--gold);
    font-family: 'Bangers', cursive;
    letter-spacing: 1.5px;
    font-size: 19px;
    padding: 10px 16px;
    display:flex; justify-content: space-between; align-items:center;
    border-bottom: 3px solid #000;
  }
  .saga-head span.count{ font-family:'Rubik'; font-size: 12px; color: #c9c3ad; }

  ul.list{ list-style:none; margin:0; padding: 6px 0; }
  li.item{
    display:flex; align-items:flex-start; gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }
  li.item:last-child{ border-bottom:none; }
  li.item:hover{ background: #ece2c9; }

  .box{
    flex: 0 0 22px;
    width: 22px; height: 22px;
    border: 2.5px solid var(--ink);
    border-radius: 3px;
    background: #fff;
    display:flex; align-items:center; justify-content:center;
    margin-top: 1px;
  }
  .box svg{ width:16px; height:16px; opacity:0; transform: scale(0.6); transition: all .12s ease; }
  li.item.done .box{ background: var(--red); border-color: var(--red-dark); }
  li.item.done .box svg{ opacity:1; transform: scale(1); }
  li.item.done .title{ text-decoration: line-through; color: var(--muted); }

  .title{ font-size: 15px; font-weight: 500; line-height:1.35; flex:1; }
  .year{ color: var(--muted); font-weight: 400; }
  .dur{
    flex: 0 0 auto;
    font-size: 11.5px;
    color: var(--red-dark);
    background: #e9dfc3;
    border: 1px solid #c9bd93;
    border-radius: 10px;
    padding: 2px 9px;
    white-space: nowrap;
    margin-top: 2px;
  }
  li.item.done .dur{ color: var(--muted); background: #ded4b8; border-color: #c9bd93; }

  .saga-badge{
    flex: 0 0 auto;
    font-size: 10px;
    letter-spacing: .3px;
    text-transform: uppercase;
    font-weight: 500;
    padding: 3px 7px;
    border-radius: 3px;
    margin-top: 3px;
    color: #fff;
    background: var(--red-dark);
  }
  .saga-badge.multiverse{ background: #4a4738; }

  footer{
    text-align:center; color:#6a6a6a; font-size:11.5px; margin-top:24px;
  }

  .sync-panel{
    background: var(--panel);
    border: 2px solid #000;
    border-radius: 6px;
    padding: 10px 14px;
    margin-top: 12px;
  }
  .sync-row{
    display:flex; align-items:center; gap:8px; flex-wrap: wrap;
  }
  .sync-row + .sync-row{ margin-top: 8px; }
  .sync-label{ font-size: 12px; color: #c9c3ad; }
  .sync-label.on{ color: var(--gold); }
  .sync-input{
    font-family: 'Rubik', sans-serif;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 4px;
    border: 1.5px solid #444;
    background: #101010;
    color: #f1ecd9;
    flex: 1 1 120px;
    min-width: 0;
  }
  .sync-btn{
    font-family: 'Rubik', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1.5px solid var(--gold);
    background: var(--gold);
    color: #1b1200;
    cursor: pointer;
    white-space: nowrap;
  }
  .sync-btn.ghost{
    background: transparent;
    color: #c9a45a;
    border-color: #6a552a;
  }

  @media (max-width:480px){
    body{ padding: 12px 8px 32px; }
    .hero{ padding: 16px 14px 20px; }
    h1{ font-size: 26px; margin-bottom: 10px; }
    .eyebrow{ font-size: 12.5px; }
    .stats{ gap: 7px; }
    .stat{ min-width: 0; flex: 1 1 30%; padding:6px 8px; text-align:center; }
    .stat .n{ font-size: 18px; }
    .stat .l{ font-size: 9px; }
    .controls{ gap:6px; margin: 12px 0 6px; }
    .tab{ font-size: 13px; padding: 6px 11px; }
    .reset-btn{ font-size: 11px; padding: 6px 9px; }
    .saga-head{ font-size: 16px; padding: 9px 12px; flex-wrap: wrap; gap: 4px; }
    li.item{ padding: 9px 12px; flex-wrap: wrap; gap: 6px 8px; }
    .title{ font-size: 14px; min-width: 0; }
    .box{ margin-top: 0; }
    .dur{ font-size: 10.5px; margin-left: 34px; }
    .saga-badge{ font-size: 9px; margin-left: 34px; }
  }

  @media (max-width:360px){
    h1{ font-size: 22px; }
    .stat .n{ font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <p class="eyebrow">Marvel cinematic universe</p>
    <h1>Watch order checklist</h1>
    <div class="stats">
      <div class="stat"><span class="n" id="statDone">0</span><span class="l">watched</span></div>
      <div class="stat"><span class="n" id="statLeft">0</span><span class="l">to go</span></div>
      <div class="stat"><span class="n" id="statPct">0%</span><span class="l">complete</span></div>
    </div>
    <div class="stats" style="margin-top:8px;">
      <div class="stat"><span class="n" id="hoursDone">0h</span><span class="l">watch time logged</span></div>
      <div class="stat"><span class="n" id="hoursLeft">0h</span><span class="l">watch time left</span></div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <div class="sync-panel" id="syncPanel">
    <div class="sync-row">
      <span class="sync-label" id="syncStatus">Not syncing &mdash; progress stays on this device only</span>
    </div>
    <div class="sync-row">
      <input type="text" id="syncInput" class="sync-input" placeholder="Enter sync code" maxlength="12" autocomplete="off">
      <button class="sync-btn" id="syncConnectBtn">Use this code</button>
      <button class="sync-btn" id="syncGenerateBtn">Generate new code</button>
      <button class="sync-btn ghost" id="syncStopBtn" style="display:none;">Stop syncing</button>
    </div>
  </div>

  <div class="controls">
    <button class="tab active" data-tab="all">All</button>
    <button class="tab" data-tab="infinity">Infinity saga</button>
    <button class="tab" data-tab="multiverse">Multiverse saga</button>
    <button class="reset-btn" id="resetBtn">Reset all</button>
  </div>

  <div class="controls" style="margin-top:0;">
    <button class="tab order-tab active" data-order="chrono">Chronological order</button>
    <button class="tab order-tab" data-order="release">Release date order</button>
  </div>

  <div id="lists"></div>

  <footer>Tap a title to mark it watched. Your progress is saved automatically. Series runtimes are approximate totals across all episodes.</footer>
</div>

<script>
// runtime in minutes: movies = theatrical runtime, series = sum of all episodes
// release: the title's rank in actual theatrical/premiere release order (1 = released first)
const DATA = {
  infinity: {
    label: "The Infinity Saga",
    items: [
      ["Captain America: The First Avenger (2011)", 124, 5],
      ["Captain Marvel (2019)", 123, 21],
      ["Iron Man (2008)", 126, 1],
      ["Iron Man 2 (2010)", 124, 3],
      ["The Incredible Hulk (2008)", 112, 2],
      ["Thor (2011)", 115, 4],
      ["Avengers (2012)", 143, 6],
      ["Thor: The Dark World (2013)", 112, 8],
      ["Iron Man 3 (2013)", 130, 7],
      ["Captain America: The Winter Soldier (2014)", 136, 9],
      ["Guardians of the Galaxy (2014)", 121, 10],
      ["Guardians of the Galaxy Vol. 2 (2017)", 136, 15],
      ["I am Groot (2022-2023)", 25, 37],
      ["Avengers: Age of Ultron (2015)", 141, 11],
      ["Ant-Man (2015)", 117, 12],
      ["Captain America: Civil War (2016)", 147, 13],
      ["Black Widow (2021)", 134, 27],
      ["Black Panther (2018)", 134, 18],
      ["Spider-Man: Homecoming (2017)", 133, 16],
      ["Doctor Strange (2016)", 115, 14],
      ["Thor: Ragnarok (2017)", 130, 17],
      ["Ant-Man and The Wasp (2018)", 118, 20],
      ["Avengers: Infinity War (2018)", 149, 19],
      ["Avengers: Endgame (2019)", 181, 22]
    ]
  },
  multiverse: {
    label: "The Multiverse Saga",
    items: [
      ["Loki (2021-2023)", 600, 26],
      ["Spider-Man: Far From Home (2019)", 129, 23],
      ["Spider-Man: No Way Home (2021)", 148, 32],
      ["What if...? (2021-2024)", 910, 28],
      ["WandaVision (2021)", 320, 24],
      ["Shang-Chi and the Legend of the Ten Rings (2021)", 132, 29],
      ["The Falcon and the Winter Soldier (2021)", 290, 25],
      ["Eternals (2021)", 156, 30],
      ["Doctor Strange in the Multiverse of Madness (2022)", 126, 34],
      ["Hawkeye (2021)", 290, 31],
      ["Moon Knight (2022)", 290, 33],
      ["Black Panther: Wakanda Forever (2022)", 161, 40],
      ["She-Hulk (2022)", 300, 38],
      ["Ms. Marvel (2022)", 210, 35],
      ["Thor: Love and Thunder (2022)", 119, 36],
      ["Ironheart (2025)", 240, 50],
      ["Werewolf by Night (2022)", 55, 39],
      ["Guardians of the Galaxy: Holiday Special (2022)", 44, 41],
      ["Ant-Man and The Wasp: Quantumania (2023)", 125, 42],
      ["Guardians of the Galaxy Vol. 3 (2023)", 150, 43],
      ["Secret Invasion (2023)", 200, 44],
      ["The Marvels (2023)", 105, 45],
      ["Deadpool & Wolverine (2024)", 128, 46],
      ["Agatha All Along (2024)", 340, 47],
      ["Captain America: Brave New World (2025)", 118, 48],
      ["Thunderbolts* (2025)", 127, 49]
    ]
  }
};

const STORAGE_KEY = "mcu-checklist-progress";
const SYNC_CODE_KEY = "mcu-checklist-sync-code";
// Paste your Firebase Realtime Database URL here, e.g. "https://your-project-id-default-rtdb.firebaseio.com"
const FIREBASE_DB_URL = "https://mcu-watchlist-58ea6-default-rtdb.europe-west1.firebasedatabase.app/";

let state = {};
let currentTab = "all";
let currentOrder = "chrono";
let storageWarned = false;
let hasCloudStorage = typeof window.storage !== 'undefined';
let syncCode = localStorage.getItem(SYNC_CODE_KEY) || null;
let syncConfigured = FIREBASE_DB_URL && !FIREBASE_DB_URL.startsWith("PASTE_");

function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function genSyncCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no ambiguous chars
  let out = '';
  for(let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

async function fetchCloudState(code){
  const res = await fetch(`${FIREBASE_DB_URL}/mcu-checklists/${code}.json`);
  if(!res.ok) throw new Error('cloud fetch failed: ' + res.status);
  return await res.json(); // null if nothing saved yet under this code
}

async function pushCloudState(code, data){
  const res = await fetch(`${FIREBASE_DB_URL}/mcu-checklists/${code}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('cloud push failed: ' + res.status);
}

async function loadState(){
  if(syncConfigured && syncCode){
    try{
      const cloudData = await fetchCloudState(syncCode);
      if(cloudData){
        state = cloudData;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return;
      }
      // nothing saved under this code yet: fall through and seed it from whatever's local
    }catch(e){
      showStorageWarning("Couldn't reach the sync server just now, so showing your last saved progress on this device instead.");
    }
  }
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      state = res ? JSON.parse(res.value) : {};
      return;
    }catch(e){
      // fall through to local storage below
    }
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : {};
  }catch(e){
    state = {};
  }
}

function showStorageWarning(text){
  if(storageWarned) return;
  storageWarned = true;
  const banner = document.createElement('div');
  banner.textContent = text;
  banner.style.cssText = "background:#3a2a12;color:#f0c98a;border:2px solid #000;border-radius:6px;padding:8px 12px;font-size:12.5px;margin-top:12px;";
  document.querySelector('.hero').after(banner);
}

async function saveState(retries = 2){
  // always keep a local cache so the app works offline / instantly on next load
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}

  if(syncConfigured && syncCode){
    for(let attempt = 0; attempt <= retries; attempt++){
      try{
        await pushCloudState(syncCode, state);
        return;
      }catch(e){
        if(attempt < retries){
          await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
        }else{
          showStorageWarning("Couldn't sync to the cloud just now. Your changes are saved on this device and will sync next time it's reachable.");
        }
      }
    }
    return;
  }

  if(hasCloudStorage){
    for(let attempt = 0; attempt <= retries; attempt++){
      try{
        await window.storage.set(STORAGE_KEY, JSON.stringify(state));
        return;
      }catch(e){
        if(attempt < retries){
          await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
        }
      }
    }
    showStorageWarning("Saving to Claude's cloud storage isn't working right now, so progress is being kept in this browser instead. It'll persist here but won't follow you to another device.");
  }
}

function checkSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"></polyline></svg>';
}

function formatHours(minutes){
  const h = minutes / 60;
  if(h < 10) return (Math.round(h*10)/10) + 'h';
  return Math.round(h) + 'h';
}

function render(){
  const container = document.getElementById('lists');
  container.innerHTML = '';

  const sagasToShow = currentTab === 'all' ? ['infinity','multiverse'] : [currentTab];

  let totalDone = 0, totalCount = 0;
  let minutesDone = 0, minutesTotal = 0;

  function rowHtml(sagaKey, item, mins, showBadge){
    const id = sagaKey + ':' + slugify(item);
    const isDone = !!state[id];
    if(isDone) totalDone++;
    totalCount++;
    minutesTotal += mins;
    if(isDone) minutesDone += mins;
    const match = item.match(/^(.*)\s(\(.+\))$/);
    const title = match ? match[1] : item;
    const year = match ? match[2] : '';
    const badge = showBadge
      ? `<div class="saga-badge ${sagaKey}">${sagaKey === 'infinity' ? 'Infinity' : 'Multiverse'}</div>`
      : '';
    return `<li class="item ${isDone ? 'done':''}" data-id="${id}">
        <div class="box">${checkSvg()}</div>
        <div class="title">${title} <span class="year">${year}</span></div>
        ${badge}
        <div class="dur">${formatHours(mins)}</div>
      </li>`;
  }

  if(currentOrder === 'chrono'){
    sagasToShow.forEach(sagaKey => {
      const saga = DATA[sagaKey];
      const sagaEl = document.createElement('div');
      sagaEl.className = 'saga';

      let doneCount = 0, sagaMinDone = 0, sagaMinTotal = 0;
      const listHtml = saga.items.map(([item, mins]) => {
        const before = totalDone, beforeMin = minutesDone;
        const html = rowHtml(sagaKey, item, mins, false);
        if(totalDone > before) doneCount++;
        sagaMinTotal += mins;
        if(totalDone > before) sagaMinDone += mins;
        return html;
      }).join('');

      sagaEl.innerHTML = `
        <div class="saga-head">
          <span>${saga.label}</span>
          <span class="count">${doneCount} / ${saga.items.length} &middot; ${formatHours(sagaMinDone)} / ${formatHours(sagaMinTotal)}</span>
        </div>
        <ul class="list">${listHtml}</ul>
      `;
      container.appendChild(sagaEl);
    });
  }else{
    // release date order: flatten across the selected saga(s) and sort by release rank
    const flat = [];
    sagasToShow.forEach(sagaKey => {
      DATA[sagaKey].items.forEach(([item, mins, rel]) => {
        flat.push({ sagaKey, item, mins, rel });
      });
    });
    flat.sort((a, b) => a.rel - b.rel);

    const showBadge = sagasToShow.length > 1;
    const listHtml = flat.map(r => rowHtml(r.sagaKey, r.item, r.mins, showBadge)).join('');

    const sagaEl = document.createElement('div');
    sagaEl.className = 'saga';
    sagaEl.innerHTML = `
      <div class="saga-head">
        <span>Release date order</span>
        <span class="count">${totalDone} / ${totalCount} &middot; ${formatHours(minutesDone)} / ${formatHours(minutesTotal)}</span>
      </div>
      <ul class="list">${listHtml}</ul>
    `;
    container.appendChild(sagaEl);
  }

  document.getElementById('statDone').textContent = totalDone;
  document.getElementById('statLeft').textContent = totalCount - totalDone;
  const pct = totalCount ? Math.round((totalDone/totalCount)*100) : 0;
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('hoursDone').textContent = formatHours(minutesDone);
  document.getElementById('hoursLeft').textContent = formatHours(minutesTotal - minutesDone);

  container.querySelectorAll('.item').forEach(li => {
    li.addEventListener('click', () => {
      const id = li.dataset.id;
      state[id] = !state[id];
      render();
      saveState();
    });
  });
}

document.querySelectorAll('.tab[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
  });
});

document.querySelectorAll('.order-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.order-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentOrder = btn.dataset.order;
    render();
  });
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if(confirm('Reset all watched progress?')){
    state = {};
    await saveState();
    render();
  }
});

function updateSyncUI(){
  const statusEl = document.getElementById('syncStatus');
  const stopBtn = document.getElementById('syncStopBtn');
  const input = document.getElementById('syncInput');

  if(!syncConfigured){
    statusEl.textContent = "Sync isn't set up on this page yet (needs a Firebase database URL).";
    statusEl.classList.remove('on');
    stopBtn.style.display = 'none';
    return;
  }
  if(syncCode){
    statusEl.textContent = `Syncing with code: ${syncCode} — enter this same code on your other devices`;
    statusEl.classList.add('on');
    stopBtn.style.display = '';
    input.value = '';
    input.placeholder = syncCode;
  }else{
    statusEl.textContent = "Not syncing — progress stays on this device only";
    statusEl.classList.remove('on');
    stopBtn.style.display = 'none';
  }
}

async function connectWithCode(code){
  code = code.trim().toUpperCase();
  if(!code) return;
  syncCode = code;
  localStorage.setItem(SYNC_CODE_KEY, syncCode);
  updateSyncUI();
  try{
    const cloudData = await fetchCloudState(syncCode);
    if(cloudData){
      state = cloudData;
    }else{
      // brand new code: seed the cloud with whatever's on this device right now
      await pushCloudState(syncCode, state);
    }
    render();
  }catch(e){
    showStorageWarning("Couldn't reach the sync server to connect. Check the code and your connection, then try again.");
  }
}

document.getElementById('syncConnectBtn').addEventListener('click', () => {
  if(!syncConfigured){
    alert('Sync needs a Firebase database URL added to this page first. See the setup instructions.');
    return;
  }
  const val = document.getElementById('syncInput').value;
  if(!val.trim()){
    alert('Type a code first, or use "Generate new code" to create one.');
    return;
  }
  connectWithCode(val);
});

document.getElementById('syncGenerateBtn').addEventListener('click', () => {
  if(!syncConfigured){
    alert('Sync needs a Firebase database URL added to this page first. See the setup instructions.');
    return;
  }
  connectWithCode(genSyncCode());
});

document.getElementById('syncStopBtn').addEventListener('click', () => {
  if(confirm("Stop syncing? This device will keep its current progress, but won't send or receive updates anymore.")){
    syncCode = null;
    localStorage.removeItem(SYNC_CODE_KEY);
    updateSyncUI();
  }
});

// pull latest from the cloud whenever the tab regains focus, so changes made on another device show up
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible' && syncConfigured && syncCode){
    try{
      const cloudData = await fetchCloudState(syncCode);
      if(cloudData) { state = cloudData; render(); }
    }catch(e){ /* stay on last known state if offline */ }
  }
});

(async () => {
  updateSyncUI();
  await loadState();
  render();
})();
</script>
</body>
</html>
